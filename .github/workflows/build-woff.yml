name: Build WOFF font

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fontforge fonttools woff2 perl

      - name: Install node dependencies
        run: yarn install --frozen-lockfile

      - name: Build font
        run: make NPM=yarn PYTHON=/usr/bin/python3

      - name: Compress to WOFF2
        run: |
          cp "build/Twemoji Mozilla.ttf" build/TwemojiMozilla.ttf
          woff2_compress build/TwemojiMozilla.ttf

      - uses: actions/upload-artifact@v4
        with:
          name: twemoji-mozilla-woff2
          path: |
            build/TwemojiMozilla.woff2
            build/TwemojiMozilla.ttf
